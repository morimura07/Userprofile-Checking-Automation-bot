<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Profile Finder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <h1>Profile Finder</h1>
        </div>
        <p class="subtitle">Find CEOs, Founders, CTOs & more</p>
      </div>
      <button type="button" class="sidebar-btn" id="sidebarBtn" title="Open in sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg>
      </button>
    </header>

    <main class="popup-main">

      <!-- Stats -->
      <div class="stats-card" id="statsCard">
        <div class="stat-row">
          <span class="stat-label">Searched</span>
          <span class="stat-value" id="searchedCount">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-row">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="totalCount">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-row">
          <span class="stat-label">Found</span>
          <span class="stat-value stat-highlight" id="foundCount">0</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">Ready</span>
        <span class="error-detail" id="errorDetail" title="Error details"></span>
      </div>

      <!-- Keyword manager -->
      <div class="kw-section">
        <div class="kw-section-header">
          <span class="kw-label">Search Keywords</span>
          <span class="kw-counter" id="kwCounter">0 / 10</span>
        </div>
        <div class="kw-input-row">
          <input
            type="text"
            id="kwInput"
            class="kw-input"
            placeholder="Add keyword..."
            maxlength="50"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" class="btn-add" id="kwAddBtn">Add</button>
        </div>
        <div class="kw-tags" id="kwTags"></div>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <button type="button" class="btn btn-primary" id="searchBtn">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </span>
          Search User Profiles
        </button>
        <button type="button" class="btn btn-stop" id="stopBtn" style="display: none;">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </span>
          Stop
        </button>
        <button type="button" class="btn btn-secondary" id="viewBtn" disabled>
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </span>
          View Results
        </button>
        <button type="button" class="btn btn-clear" id="clearBtn">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </span>
          Clear All Data
        </button>
      </div>

    </main>

      <!-- OpenAI API Key -->
      <div class="settings-section">
        <div class="settings-label">OpenAI API Key</div>
        <div class="settings-row">
          <input type="password" id="openaiKeyInput" class="kw-input" placeholder="sk-..." autocomplete="off" />
          <button type="button" class="btn-add" id="openaiKeySave">Save</button>
        </div>
        <p class="settings-hint">Required for AI analysis in the results modal. Stored locally.</p>
      </div>

    <footer class="popup-footer">
      <p>Open a Discord channel with the member list visible, then click Search.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
